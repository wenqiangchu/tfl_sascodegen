id: 'tpl_teae'
body:
  stub_header: 'System Organ Class / Preferred Term'
  chunks:
    - id: 'teae_overall'
      type: 'categorical_summary_nonexclusive'
      source_data: 'study.adae'
      filter: 'SAFFL = ''Y'' and TRTEMFL = ''Y'''
      counting_unit: 'distinct_subject'
      denominator:
        scope: 'header_population'
        unit: 'distinct_subject'
      rows:
        - id: 'any_teae'
          type: 'analysis'
          label: 'At Least One TEAE'
          condition: '1'
          statistics:
            - id: 'n'
            - id: 'pct'
              digits: 1
          cell_format: '{n} ({pct}%)'
    - id: 'ae_by_soc_pt'
      type: 'hierarchical_summary'
      source_data: 'study.adae'
      filter: 'SAFFL = ''Y'' and TRTEMFL = ''Y'''
      levels:
        - id: 'soc'
          variable: 'AEBODSYS'
          label_variable: 'AEBODSYS'
          order_variable: 'AEBODSYS'
          order_direction: 'asc'
          node_role: 'analysis'
          node_analysis_id: 'soc_subjects'
          missing_policy: 'exclude'
          result_sort:
            metric:
              analysis_id: 'soc_subjects'
              row_id: 'subjects'
              statistic_id: 'n'
            column_order: [4, 3, 1, 0]
            direction: 'desc'
        - id: 'pt'
          variable: 'AEDECOD'
          label_variable: 'AEDECOD'
          order_variable: 'AEDECOD'
          order_direction: 'asc'
          node_role: 'analysis'
          node_analysis_id: 'pt_subjects'
          missing_policy: 'exclude'
          result_sort:
            metric:
              analysis_id: 'pt_subjects'
              row_id: 'subjects'
              statistic_id: 'n'
            column_order: [4, 3, 1, 0]
            direction: 'desc'
      analysis_blocks:
        - id: 'soc_subjects'
          anchor_level: 'soc'
          placement: 'same_row'
          type: 'categorical_summary_nonexclusive'
          counting_unit: 'distinct_subject'
          denominator:
            scope: 'header_population'
            unit: 'distinct_subject'
          rows:
            - id: 'subjects'
              type: 'analysis'
              label: 'Subjects'
              condition: '1'
              statistics:
                - id: 'n'
                - id: 'pct'
                  digits: 1
              cell_format: '{n} ({pct}%)'
        - id: 'pt_subjects'
          anchor_level: 'pt'
          placement: 'same_row'
          type: 'categorical_summary_nonexclusive'
          counting_unit: 'distinct_subject'
          denominator:
            scope: 'header_population'
            unit: 'distinct_subject'
          rows:
            - id: 'subjects'
              type: 'analysis'
              label: 'Subjects'
              condition: '1'
              statistics:
                - id: 'n'
                - id: 'pct'
                  digits: 1
              cell_format: '{n} ({pct}%)'
