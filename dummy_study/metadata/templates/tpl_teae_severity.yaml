id: 'tpl_teae_severity'
body:
  stub_header: 'Maximum Severity / System Organ Class / Preferred Term'
  chunks:
    - id: 'ae_by_sev_soc_pt'
      type: 'hierarchical_summary'
      source_data: 'WORK.AE_MAXSEV'
      levels:
        - id: 'sev'
          variable: 'SEV_ORDER'
          format: 'TFLSEV'
          node_role: 'analysis'
          node_analysis_id: 'sev_subjects'
          missing_policy: 'exclude'
        - id: 'soc'
          variable: 'AEBODSYS'
          label_variable: 'AEBODSYS'
          order_variable: 'AEBODSYS'
          order_direction: 'asc'
          node_role: 'analysis'
          node_analysis_id: 'soc_subjects'
          missing_policy: 'exclude'
          result_sort:
            metric:
              analysis_id: 'soc_subjects'
              row_id: 'subjects'
              statistic_id: 'n'
            column_order: [4, 3, 1, 0]
            direction: 'desc'
        - id: 'pt'
          variable: 'AEDECOD'
          label_variable: 'AEDECOD'
          order_variable: 'AEDECOD'
          order_direction: 'asc'
          node_role: 'analysis'
          node_analysis_id: 'pt_subjects'
          missing_policy: 'exclude'
          result_sort:
            metric:
              analysis_id: 'pt_subjects'
              row_id: 'subjects'
              statistic_id: 'n'
            column_order: [4, 3, 1, 0]
            direction: 'desc'
      analysis_blocks:
        - id: 'sev_subjects'
          anchor_level: 'sev'
          placement: 'same_row'
          type: 'categorical_summary_nonexclusive'
          counting_unit: 'distinct_subject'
          denominator:
            scope: 'header_population'
            unit: 'distinct_subject'
          rows:
            - id: 'subjects'
              type: 'analysis'
              label: 'Subjects'
              condition: '1'
              statistics:
                - id: 'n'
                - id: 'pct'
                  digits: 1
              cell_format: '{n} ({pct}%)'
        - id: 'soc_subjects'
          anchor_level: 'soc'
          placement: 'same_row'
          type: 'categorical_summary_nonexclusive'
          counting_unit: 'distinct_subject'
          denominator:
            scope: 'header_population'
            unit: 'distinct_subject'
          rows:
            - id: 'subjects'
              type: 'analysis'
              label: 'Subjects'
              condition: '1'
              statistics:
                - id: 'n'
                - id: 'pct'
                  digits: 1
              cell_format: '{n} ({pct}%)'
        - id: 'pt_subjects'
          anchor_level: 'pt'
          placement: 'same_row'
          type: 'categorical_summary_nonexclusive'
          counting_unit: 'distinct_subject'
          denominator:
            scope: 'header_population'
            unit: 'distinct_subject'
          rows:
            - id: 'subjects'
              type: 'analysis'
              label: 'Subjects'
              condition: '1'
              statistics:
                - id: 'n'
                - id: 'pct'
                  digits: 1
              cell_format: '{n} ({pct}%)'
