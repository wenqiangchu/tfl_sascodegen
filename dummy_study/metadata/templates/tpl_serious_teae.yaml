id: 'tpl_serious_teae'
body:
  stub_header: 'System Organ Class / Preferred Term'
  chunks:
    - id: 'serious_ae_by_soc_pt'
      type: 'hierarchical_summary'
      source_data: 'study.adae'
      filter: 'SAFFL = ''Y'' and TRTEMFL = ''Y'' and AESER = ''Y'''
      # This table exists to exercise format-driven levels end to end, not to
      # answer a clinical question. Both levels declare `format` and therefore
      # declare no label_variable, order_variable or order_direction: a format
      # supplies the node domain, the display label and the node order together.
      levels:
        - id: 'soc'
          variable: 'AEBODSYS'
          format: '$tflssoc'
          node_role: 'analysis'
          node_analysis_id: 'soc_subjects'
          missing_policy: 'exclude'
        - id: 'pt'
          variable: 'AEDECOD'
          format: '$tflspt'
          node_role: 'analysis'
          node_analysis_id: 'pt_subjects'
          missing_policy: 'exclude'
      analysis_blocks:
        - id: 'soc_subjects'
          anchor_level: 'soc'
          placement: 'same_row'
          type: 'categorical_summary_nonexclusive'
          counting_unit: 'distinct_subject'
          denominator:
            scope: 'header_population'
            unit: 'distinct_subject'
          rows:
            - id: 'subjects'
              type: 'analysis'
              label: 'Subjects'
              condition: '1'
              statistics:
                - id: 'n'
                - id: 'pct'
                  digits: 1
              cell_format: '{n} ({pct}%)'
        - id: 'pt_subjects'
          anchor_level: 'pt'
          placement: 'same_row'
          type: 'categorical_summary_nonexclusive'
          counting_unit: 'distinct_subject'
          denominator:
            scope: 'header_population'
            unit: 'distinct_subject'
          rows:
            - id: 'subjects'
              type: 'analysis'
              label: 'Subjects'
              condition: '1'
              statistics:
                - id: 'n'
                - id: 'pct'
                  digits: 1
              cell_format: '{n} ({pct}%)'
