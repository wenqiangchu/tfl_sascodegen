id: 't_14_3_1_4_teae_severity'
population_id: 'safety'
header_id: 'trt01a_header'
template_id: 'tpl_teae_severity'
custom_code:
  before: |-
    /* One row per subject x SOC x PT, carrying two severity reductions.

       SEV_ORDER is the worst severity of that SOC/PT pair for the subject, which
       is the grain the report needs at the PT level. SOC_SEV_ORDER is the worst
       severity of the whole SOC for that subject, collapsed across their PTs in
       it, which the SOC-level severity rows need: conditioning those rows on
       SEV_ORDER would count a subject once per PT that reaches the severity, so
       the three rows would overlap and sum to more than the SOC total. */
    /* SEV_ORDER is a display order, not a severity score: 1 is the most severe
       value so that ascending numeric order matches the report order. A severity
       score with 3 for SEVERE would sort MILD first, because the emitter orders
       formatted numeric nodes by their unformatted value. */
    proc sql;
      create table WORK.AE_MAXSEV as
        select USUBJID,
               TRTA,
               AEBODSYS,
               AEDECOD,
               min(case AESEV
                     when 'SEVERE'   then 1
                     when 'MODERATE' then 2
                     when 'MILD'     then 3 end) as SEV_ORDER
          from study.adae
         where SAFFL = 'Y' and TRTEMFL = 'Y'
         group by USUBJID, TRTA, AEBODSYS, AEDECOD;

      create table WORK.AE_PTSEV as
        select USUBJID, TRTA, AEBODSYS, AEDECOD, SEV_ORDER
          from WORK.AE_MAXSEV;

      create table WORK.AE_MAXSEV as
        select a.*,
               b.SOC_SEV_ORDER
          from WORK.AE_PTSEV as a
          inner join
            (select USUBJID, TRTA, AEBODSYS, min(SEV_ORDER) as SOC_SEV_ORDER
               from WORK.AE_PTSEV
              group by USUBJID, TRTA, AEBODSYS) as b
            on  a.USUBJID = b.USUBJID
            and a.TRTA = b.TRTA
            and a.AEBODSYS = b.AEBODSYS;
    quit;
